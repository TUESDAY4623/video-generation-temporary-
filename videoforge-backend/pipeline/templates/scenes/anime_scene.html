<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:{{palette.background}}; color:{{palette.text}}; font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; position:relative; }
  .bg-gradient { position:absolute; inset:0; background: linear-gradient(135deg, {{palette.primary}} 0%, {{palette.secondary}} 100%); }
  .particles { position:absolute; inset:0; overflow:hidden; }
  .particle { position:absolute; width:6px; height:6px; background:{{palette.accent}}; border-radius:50%; opacity:0.3; animation: float 8s infinite ease-in-out; }
  .particle:nth-child(1) { left:10%; top:20%; animation-delay:0s; }
  .particle:nth-child(2) { left:30%; top:60%; animation-delay:2s; }
  .particle:nth-child(3) { left:60%; top:30%; animation-delay:4s; }
  .particle:nth-child(4) { left:80%; top:70%; animation-delay:1s; }
  .particle:nth-child(5) { left:50%; top:80%; animation-delay:3s; }
  .content { position:relative; z-index:1; text-align:center; padding:40px; max-width:1000px; animation: fadeInUp 1.2s ease-out; }
  .icon { font-size:4em; margin-bottom:20px; }
  h2 { font-size:3em; color:{{palette.accent}}; margin-bottom:20px; }
  p { font-size:1.3em; line-height:1.7; color:{{palette.text_secondary}}; }
  @keyframes float { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-40px) scale(1.2); } }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="particles">
  <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div>
</div>
<div class="content">
  <div class="icon">{{icon}}</div>
  <h2>{{title}}</h2>
  <p>{{text}}</p>
</div>
</body>
</html>
