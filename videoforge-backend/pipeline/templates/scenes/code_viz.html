<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:#0d1117; color:#c9d1d9; font-family:'Fira Code','Consolas','Monaco',monospace; padding:40px; overflow:hidden; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .lang-badge { background:#161b22; color:#58a6ff; padding:6px 16px; border-radius:6px; font-size:0.9em; border:1px solid #30363d; }
  pre { background:#161b22; padding:24px; border-radius:12px; overflow-x:auto; line-height:1.8; font-size:1em; border:1px solid #30363d; }
  .keyword { color:#ff7b72; }
  .string { color:#a5d6ff; }
  .comment { color:#8b949e; }
  .function { color:#d2a8ff; }
  .number { color:#79c0ff; }
</style>
</head>
<body>
  <div class="header">
    <div class="lang-badge">{{language}}</div>
  </div>
  <pre>{{code_html}}</pre>
</body>
</html>
