<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { margin:0; background:{{palette.background}}; color:{{palette.text}}; font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; padding:40px; }
  .container { width:90%; max-width:1000px; text-align:center; }
  h2 { color:{{palette.accent}}; margin-bottom:30px; }
  canvas { max-height:65vh; }
</style></head>
<body>
<div class="container">
  <h2>{{title}}</h2>
  <canvas id="chart"></canvas>
</div>
<script>
  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: {{labels|tojson}},
      datasets: [{
        data: {{values|tojson}},
        backgroundColor: [
          '{{palette.accent}}',
          '{{palette.secondary}}',
          '#58a6ff',
          '#d29922',
          '#a5d6ff',
          '#7ee787',
          '#f778ba',
          '#ffa657',
        ],
        borderColor: '{{palette.background}}',
        borderWidth: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#c9d1d9', padding: 20, font: { size: 14 } }
        }
      },
      animation: { animateRotate: true, duration: 1500 }
    }
  });
</script>
</body></html>
