<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:{{palette.background}}; color:{{palette.text}}; font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; padding:60px; }
  .presenter { display:flex; align-items:center; gap:40px; max-width:1200px; }
  .avatar { width:200px; height:200px; border-radius:50%; background:{{palette.accent}}; display:flex; align-items:center; justify-content:center; font-size:4em; flex-shrink:0; animation: pulse 3s infinite ease-in-out; }
  .speech { background:{{palette.secondary}}; padding:40px; border-radius:20px; max-width:800px; position:relative; animation: slideIn 1s ease-out; }
  .speech::before { content:''; position:absolute; left:-20px; top:50%; transform:translateY(-50%); border:10px solid transparent; border-right-color:{{palette.secondary}}; }
  .speech p { font-size:1.3em; line-height:1.7; color:{{palette.text_secondary}}; margin:0; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }
  @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
</style>
</head>
<body>
<div class="presenter">
  <div class="avatar">{{avatar_emoji}}</div>
  <div class="speech">
    <p>{{text}}</p>
  </div>
</div>
</body>
</html>
