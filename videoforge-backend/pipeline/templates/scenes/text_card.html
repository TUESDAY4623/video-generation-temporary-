<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; background:{{palette.primary}}; color:{{palette.text}}; font-family:'Segoe UI',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; padding:60px; box-sizing:border-box; }
  .content { max-width:1000px; animation: fadeIn 1s ease-out; }
  h2 { font-size:2.8em; color:{{palette.accent}}; margin-bottom:30px; }
  p { font-size:1.4em; line-height:1.8; color:{{palette.text_secondary}}; }
  .divider { width:80px; height:4px; background:{{palette.accent}}; margin:30px 0; border-radius:2px; }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
<div class="content">
  <h2>{{title}}</h2>
  <div class="divider"></div>
  <p>{{text}}</p>
</div>
</body>
</html>
